#GOAL: I have to lint, build, test the code for frontend and backend
#then push the images  to dockerhub
#

name: CI

on: 
  push:
    branches: [advanced]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: setup nodejs
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      
      - name: install dependencies
        run: npm install 
        working-directory: frontend
      
      - name:  run linter
        run: npm run lint
        working-directory: frontend

      - name: run tests
        run: npm run test 
        working-directory: frontend

      - name: Docker login
        uses: docker/login-action@v4
        with:
          username: ${{ var.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: docker build and push
        uses: docker/build-push-action@v7
        with:
          content: frontend
          push: true
          tags: ${{ var.DOCKERHUB_USERNAME }}/devboard-frontend:latest