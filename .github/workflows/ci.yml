#GOAL: I have to lint, build, test the code for frontend and backend
#then push the images  to dockerhub
#

name: CI

on: 
  push:
    branches: [advanced]

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: setup nodejs
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      
      - name: install dependencies
        run: npm install 
        working-directory: frontend
      
      - name:  run linter
        run: npm run lint
        working-directory: frontend

      - name: run tests
        run: npm run test 
        working-directory: frontend

      - name: Docker login
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: docker build and push
        uses: docker/build-push-action@v7
        with:
          context: frontend
          push: true
          tags: ${{ vars.DOCKERHUB_USERNAME }}/devboard-frontend:latest

  backend:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v7

      - name: setup go
        uses: actions/setup-go@v6
        with:
          go-version: '1.23'
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: run go formater
        run: go fmt 
        working-directory: backend

      - name: run go vet
        run: go vet
        working-directory: backend

      - name: run go tests
        run: go test
        working-directory: backend

      - name: Docker login
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: docker build and push
        uses: docker/build-push-action@v7
        with:
          context: backend
          push: true
          tags: ${{ vars.DOCKERHUB_USERNAME }}/devboard-backend:latest

  deploy:
    needs: [frontend, backend]
    uses: ./.github/workflows/cd.yml
    secrets: inherit


      